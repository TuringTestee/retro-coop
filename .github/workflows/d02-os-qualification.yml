name: Temporary independent public guest qualification
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Qualification runner
        type: choice
        options: [ubuntu-24.04]
        required: true
      lobby:
        description: Exact temporary public lobby name
        required: true
      mode:
        type: choice
        options: [direct, relay]
        required: true
permissions:
  contents: read
jobs:
  guest:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install one pinned browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Join public host from independent GitHub network
        env:
          LOBBY: ${{ inputs.lobby }}
          MODE: ${{ inputs.mode }}
        run: python .qualification/public_peer.py --role guest --lobby "$LOBBY" --mode "$MODE" --output proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-guest-${{ inputs.mode }}
          path: proof
          retention-days: 7
