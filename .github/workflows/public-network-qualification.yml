name: Temporary final release independent network proof
on:
  push:
    branches: [test/public-independent-network]
permissions:
  contents: read
env:
  QUALIFICATION_LOBBY: ReleaseRelay20261004T1520
  QUALIFICATION_MODE: relay
  QUALIFICATION_PASSWORD: QualificationCohort20261004T1520
  QUALIFICATION_PLAY_SECONDS: 15
  PUBLIC_PRODUCT_REVISION: 7ca1d28d68dadc754bdc31360494b19bd9bef926
  PUBLIC_CORE_SHA256: a8478f5e67edf77a1af7d43a0015b3234a1d309af269ef2e59294495ee26872b
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install one pinned browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Join public host from independent GitHub network
        run: >-
          python .qualification/public_peer.py --role guest
          --lobby "$QUALIFICATION_LOBBY" --mode "$QUALIFICATION_MODE"
          --product-revision "$PUBLIC_PRODUCT_REVISION"
          --core-sha256 "$PUBLIC_CORE_SHA256"
          --play-seconds "$QUALIFICATION_PLAY_SECONDS" --check-enter --output proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-guest-${{ env.QUALIFICATION_MODE }}
          path: proof
          retention-days: 7
