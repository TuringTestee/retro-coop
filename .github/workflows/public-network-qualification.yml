name: Temporary final release independent network proof
on:
  push:
    branches: [test/public-independent-network]
permissions:
  contents: read
env:
  # Set the frozen deployed main and a unique cohort before pushing this branch.
  QUALIFICATION_SERIES: "Release51d1-234516-fec3d7"
  QUALIFICATION_PASSWORD: "JPZmA_Uiz5sjjr-F4oaCMcfm9MEbzsha"
  PUBLIC_PRODUCT_REVISION: "51d1a11ab412e236ea74189134a6b96fa3297b8d"
  PUBLIC_CORE_SHA256: "a8478f5e67edf77a1af7d43a0015b3234a1d309af269ef2e59294495ee26872b"
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mode: direct
            play_seconds: 1800
            timeout_minutes: 45
          - mode: relay
            play_seconds: 7200
            timeout_minutes: 135
    env:
      QUALIFICATION_MODE: ${{ matrix.mode }}
      QUALIFICATION_PLAY_SECONDS: ${{ matrix.play_seconds }}
    steps:
      - name: Require the frozen deployment revision
        shell: bash
        run: '[[ "$PUBLIC_PRODUCT_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install one pinned browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Join public host from independent GitHub network
        run: >-
          python .qualification/public_peer.py --role guest
          --lobby "$QUALIFICATION_SERIES-$QUALIFICATION_MODE" --mode "$QUALIFICATION_MODE"
          --product-revision "$PUBLIC_PRODUCT_REVISION"
          --core-sha256 "$PUBLIC_CORE_SHA256"
          --play-seconds "$QUALIFICATION_PLAY_SECONDS" --check-enter --output proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-guest-${{ env.QUALIFICATION_MODE }}
          path: proof
          retention-days: 7
