name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
env:
  D02_BUDGET_SECONDS: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof')) && '600' || '300' }}
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce the shared workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof') }}" = true ]; then
            python3 spikes/d02/ci_budget.py watch --gate preflight
          else
            python3 spikes/d02/ci_budget.py watch --gate entrypoint --gate images
          fi
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deadline: ${{ steps.budget.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D02_DEADLINE=$(python3 spikes/d02/ci_budget.py deadline)
          echo "deadline=$D02_DEADLINE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Build and fast preflight within the shared deadline
        env:
          D02_DEADLINE: ${{ steps.budget.outputs.deadline }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 1
        with:
          name: d02-build
          path: |
            spikes/d02/target/wasm32-unknown-unknown/release/retro_coop_d02.wasm
            spikes/d02/fixture.local.nes
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 1
        with:
          name: foundation-client
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7
  entrypoint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: d02-build
          path: spikes/d02
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Verify the documented browser journey within five minutes
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh entrypoint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        timeout-minutes: 1
        with:
          name: public-entrypoint
          path: spikes/d02/public-entrypoint.local/**
          if-no-files-found: warn
          retention-days: 7
      - name: Complete the focused pull-request gate within the original deadline
        if: github.event_name == 'pull_request'
        run: python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
  images:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: d02-build
          path: spikes/d02
      - name: Build and probe the EB source package within the shared deadline
        run: |
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/aws_eb/source_smoke.py
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/aws_eb/website_smoke.py
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/aws_eb/cost_guard_smoke.py
          cp spikes/d02/target/wasm32-unknown-unknown/release/retro_coop_d02.wasm deploy/aws-eb/core.wasm
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- docker build --file deploy/aws-eb/Dockerfile --target edge --tag retro-coop-eb-edge:candidate .
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- docker build --file deploy/aws-eb/Dockerfile --target coordinator --tag retro-coop-eb-coordinator:candidate .
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- docker build --file deploy/aws-eb/Dockerfile --target caddy --tag retro-coop-eb-caddy:candidate .
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- docker build --file deploy/aws-eb/Dockerfile --target turn --tag retro-coop-eb-turn:candidate .
          docker run --rm retro-coop-eb-caddy:candidate caddy validate --config /etc/caddy/Caddyfile
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- npm ci
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- sh scripts/aws_eb/container_smoke.sh
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/aws_eb/turn_smoke.py
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
      - name: Save exact native ARM64 images for a reviewed main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p aws-eb-arm64-images
          for target in edge coordinator caddy turn; do
            docker save --output "aws-eb-arm64-images/$target.tar" "retro-coop-eb-$target:candidate"
          done
          cd aws-eb-arm64-images
          sha256sum edge.tar coordinator.tar caddy.tar turn.tar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 3
        with:
          name: aws-eb-arm64-images
          path: aws-eb-arm64-images/*
          if-no-files-found: error
          retention-days: 7
  network:
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        pair: [Chrome-Chrome, Firefox-Firefox, Chrome-Firefox]
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
      D02_PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: d02-build
          path: spikes/d02
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: foundation-client
          path: apps/client/dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Thirty-second shared play and forced relay
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        timeout-minutes: 1
        with:
          name: d02-pair-${{ matrix.pair }}
          path: |
            spikes/d02/*.local.json
            spikes/d02/*.local.txt
            spikes/d02/*.local.png
            spikes/d02/.network-runs/**/*.json
            spikes/d02/.network-runs/**/*.log
            spikes/d02/.gameplay-runs/**/*.json
            spikes/d02/.gameplay-runs/**/*.log
            spikes/d02/relay-*.local.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  preflight:
    if: ${{ always() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof')) }}
    needs: [build, entrypoint, images, network]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      completed: ${{ steps.main_gate.outputs.completed }}
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
      D02_BUILD: ${{ needs.build.result }}
      D02_ENTRYPOINT: ${{ needs.entrypoint.result }}
      D02_IMAGES: ${{ needs.images.result }}
      D02_NETWORK: ${{ needs.network.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require every complete workload
        if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof') }}
        run: |
          test "$D02_BUILD" = success
          test "$D02_ENTRYPOINT" = success
          test "$D02_IMAGES" = success
          test "$D02_NETWORK" = success
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof') }}
        timeout-minutes: 1
        with:
          pattern: d02-pair-*
          path: /tmp/d02-pair-evidence
      - name: Require all six peers to agree within the original deadline
        if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-gate-proof') }}
        run: |
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- python3 scripts/gameplay/verify_matrix.py /tmp/d02-pair-evidence
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
      - name: Require the focused pull-request journey
        if: github.event_name == 'pull_request'
        run: |
          test "$D02_BUILD" = success
          test "$D02_ENTRYPOINT" = success
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
      - name: Mark passing main release gate
        id: main_gate
        if: github.event_name == 'push'
        run: echo "completed=$(date +%s)" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: retro-coop-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require this push to be current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git checkout -B main "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-eb-arm64-images
          path: aws-eb-arm64-images
      - name: Obtain temporary AWS credentials
        id: credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: retro-coop-main-cd
          output-credentials: true
          mask-aws-account-id: true
      - name: Install pinned image publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz \
            --output /tmp/go-containerregistry.tar.gz
          echo 'c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127  /tmp/go-containerregistry.tar.gz' | sha256sum --check
          mkdir -p /tmp/retro-eb-tools
          tar -xzf /tmp/go-containerregistry.tar.gz -C /tmp/retro-eb-tools crane
      - name: Publish checked images and bundle
        run: |
          set -euo pipefail
          python3 scripts/aws_eb/build_release.py --crane /tmp/retro-eb-tools/crane \
            --artifact-dir "$GITHUB_WORKSPACE/aws-eb-arm64-images" \
            --output "$GITHUB_WORKSPACE/retro-coop-release.zip"
      - name: Select existing Elastic Beanstalk environment
        id: release
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" && test -n "$EB_APPLICATION_NAME" && test -n "$EB_ENVIRONMENT_NAME"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          read -r previous state health < <(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" --environment-names "$EB_ENVIRONMENT_NAME" \
            --query 'Environments[0].[VersionLabel,Status,Health]' --output text)
          test "$previous" != None && test "$state" = Ready && test "$health" = Green
          bucket=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          test -n "$bucket" && test "$bucket" != None
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "version=main-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ steps.credentials.outputs.aws-access-key-id }}
          aws_secret_key: ${{ steps.credentials.outputs.aws-secret-access-key }}
          aws_session_token: ${{ steps.credentials.outputs.aws-session-token }}
          application_name: ${{ vars.EB_APPLICATION_NAME }}
          environment_name: ${{ vars.EB_ENVIRONMENT_NAME }}
          version_label: ${{ steps.release.outputs.version }}
          version_description: ${{ github.sha }}
          region: ${{ vars.AWS_REGION }}
          deployment_package: retro-coop-release.zip
          existing_bucket_name: ${{ steps.release.outputs.bucket }}
          use_existing_version_if_available: true
          wait_for_environment_recovery: 120
      - name: Confirm live version and HTTPS
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          PREVIOUS_VERSION: ${{ steps.release.outputs.previous }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          GATE_COMPLETED: ${{ needs.preflight.outputs.completed }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          test "$GATE_COMPLETED" -gt 0
          read -r actual state health < <(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" --environment-names "$EB_ENVIRONMENT_NAME" \
            --query 'Environments[0].[VersionLabel,Status,Health]' --output text)
          test "$actual" = "$EXPECTED_VERSION" && test "$state" = Ready && test "$health" = Green
          curl --fail --silent --show-error --max-time 15 "${SITE_URL%/}/healthz" | grep -q retro-coop
          {
            echo '### Website release'
            echo "Source: $GITHUB_SHA"
            echo "Previous version: $PREVIOUS_VERSION"
            echo "Live version: $actual"
            echo "EB status: $state / $health"
            echo "Public endpoint: $SITE_URL"
            echo "Release elapsed after gate: $(( $(date +%s) - GATE_COMPLETED )) seconds"
          } >> "$GITHUB_STEP_SUMMARY"
