name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
env:
  D02_BUDGET_SECONDS: ${{ github.event_name == 'pull_request' && '300' || '1800' }}
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce the shared workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 spikes/d02/ci_budget.py watch --gate entrypoint --gate images
          else
            python3 spikes/d02/ci_budget.py watch --gate preflight
          fi
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deadline: ${{ steps.budget.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D02_DEADLINE=$(python3 spikes/d02/ci_budget.py deadline)
          echo "deadline=$D02_DEADLINE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Build and fast preflight within the shared deadline
        env:
          D02_DEADLINE: ${{ steps.budget.outputs.deadline }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 1
        with:
          name: d02-build
          path: |
            spikes/d02/target/wasm32-unknown-unknown/release/retro_coop_d02.wasm
            spikes/d02/fixture.local.nes
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 1
        with:
          name: foundation-client
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7
  entrypoint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: d02-build
          path: spikes/d02
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Verify the documented browser journey within five minutes
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh entrypoint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        timeout-minutes: 1
        with:
          name: public-entrypoint
          path: spikes/d02/public-entrypoint.local/**
          if-no-files-found: warn
          retention-days: 7
      - name: Complete the focused pull-request gate within the original deadline
        if: github.event_name == 'pull_request'
        run: python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
  images:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Build and probe exact staging images within the shared deadline
        run: |
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- docker build --file deploy/staging/Dockerfile --target edge --tag retro-coop-staging-edge:candidate .
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- docker build --file deploy/staging/Dockerfile --target coordinator --tag retro-coop-staging-coordinator:candidate .
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- npm ci
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- sh scripts/staging/container_smoke.sh
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/staging/render_smoke.py
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/staging/acme_hook_smoke.py
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/staging/turn_smoke.py
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- python3 scripts/staging/turn_operator_smoke.py
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" -- sh scripts/staging/kubernetes_smoke.sh
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
  core:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: d02-build
          path: spikes/d02
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: foundation-client
          path: apps/client/dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Full core qualification within the shared deadline
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        timeout-minutes: 1
        with:
          name: d02-core
          path: |
            spikes/d02/*.local.json
            spikes/d02/*.local.txt
            spikes/d02/*.local.png
            spikes/d02/foundation.local.*.png
            spikes/d02/rooms.local.*.png
            spikes/d02/moderation.local.*.png
            spikes/d02/operator.local.*.png
            spikes/d02/chat.local.*.png
            spikes/d02/peer.local.*.png
            spikes/d02/voice-*.local.*.png
            spikes/d02/directory.local.*.png
            spikes/d02/gameplay.local/**
            spikes/d02/.network-runs/**/*.json
            spikes/d02/.network-runs/**/*.log
            spikes/d02/.gameplay-runs/**/*.json
            spikes/d02/.gameplay-runs/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  network:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pair: [Chrome-Chrome, Firefox-Firefox, Chrome-Firefox]
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
      D02_PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: d02-build
          path: spikes/d02
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 1
        with:
          name: foundation-client
          path: apps/client/dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 1
        with:
          node-version-file: .node-version
      - name: Full network qualification within the shared deadline
        run: python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- bash spikes/d02/ci_job.sh network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        timeout-minutes: 1
        with:
          name: d02-pair-${{ matrix.pair }}
          path: |
            spikes/d02/*.local.json
            spikes/d02/*.local.txt
            spikes/d02/*.local.png
            spikes/d02/.network-runs/**/*.json
            spikes/d02/.network-runs/**/*.log
            spikes/d02/.gameplay-runs/**/*.json
            spikes/d02/.gameplay-runs/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  preflight:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [build, entrypoint, images, core, network]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      D02_DEADLINE: ${{ needs.build.outputs.deadline }}
      D02_BUILD: ${{ needs.build.result }}
      D02_ENTRYPOINT: ${{ needs.entrypoint.result }}
      D02_IMAGES: ${{ needs.images.result }}
      D02_CORE: ${{ needs.core.result }}
      D02_NETWORK: ${{ needs.network.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require every complete workload
        if: github.event_name == 'push'
        run: |
          test "$D02_BUILD" = success
          test "$D02_ENTRYPOINT" = success
          test "$D02_IMAGES" = success
          test "$D02_CORE" = success
          test "$D02_NETWORK" = success
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'push'
        timeout-minutes: 1
        with:
          pattern: d02-pair-*
          path: /tmp/d02-pair-evidence
      - name: Require all six peers to agree within the original deadline
        if: github.event_name == 'push'
        run: |
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- python3 spikes/d02/verify_ci_matrix.py /tmp/d02-pair-evidence
          python3 spikes/d02/ci_budget.py run --deadline "$D02_DEADLINE" --namespace -- python3 scripts/gameplay/verify_matrix.py /tmp/d02-pair-evidence
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
      - name: Require the focused pull-request journey
        if: github.event_name == 'pull_request'
        run: |
          test "$D02_BUILD" = success
          test "$D02_ENTRYPOINT" = success
          python3 spikes/d02/ci_budget.py check --deadline "$D02_DEADLINE"
