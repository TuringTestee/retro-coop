<!doctype html><html lang="en"><head><meta name="referrer" content="no-referrer"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Retro Coop</title><script>try{const saved=localStorage.getItem('retro-coop-theme');const hour=new Date().getHours();document.documentElement.dataset.theme=saved==='light'||saved==='dark'?saved:hour>=9&&hour<17?'light':'dark'}catch{const hour=new Date().getHours();document.documentElement.dataset.theme=hour>=9&&hour<17?'light':'dark'}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
