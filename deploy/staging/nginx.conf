worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Room URLs carry unlisted identifiers; do not log request paths or client IPs.
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 64m;
    server_tokens off;

    server {
        listen 8080;
        location = /healthz { access_log off; return 200 'ok'; }
        location / { return 404; }
    }

    server {
        listen 8081;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;

        location = /coordinator/ws {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1d;
        }

        location ^~ /coordinator/rooms/ {
            proxy_pass http://127.0.0.1:8787/rooms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # The coordinator starts the upload lease when headers arrive.
            # Buffering a slow body here lets the pending room expire.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 75s;
        }

        location ^~ /coordinator/ { return 404; }
        location = /healthz { access_log off; return 200 'ok'; }

        location /assets/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            try_files $uri =404;
        }
        location /catalog/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            try_files $uri =404;
        }
        location /generated/ {
            add_header Cache-Control 'no-store';
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control 'no-store';
            try_files $uri $uri/ /index.html;
        }
    }
}
