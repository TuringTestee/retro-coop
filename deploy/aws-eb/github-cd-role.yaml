AWSTemplateFormatVersion: '2010-09-09'
Description: Main-branch OIDC access for the existing Retro Coop Elastic Beanstalk release.
Parameters:
  GitHubMainSubject:
    Type: String
    NoEcho: true
    Description: Exact GitHub OIDC subject for this repository's main branch.
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  MainCdRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retro-coop-main-cd
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubMainSubject
      Policies:
        - PolicyName: ExistingWebsiteRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: ExactImageRepository
                Effect: Allow
                Action: [ecr:DescribeRepositories, ecr:ListImages, ecr:DescribeImages,
                         ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
                         ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                         ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/retro-coop
              - Sid: ReleaseBundleObjects
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectAcl]
                Resource: !Sub arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}/retro-coop/*
              - Sid: ExistingEnvironmentExtensions
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectAcl]
                Resource: !Sub arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}/resources/environments/*/_runtime/_embedded_extensions/retro-coop/*
              - Sid: InspectReleaseBucket
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !Sub arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}
              - Sid: ReadReleaseState
                Effect: Allow
                Action: [elasticbeanstalk:CreateStorageLocation, elasticbeanstalk:DescribeEnvironments,
                         elasticbeanstalk:DescribeApplicationVersions, elasticbeanstalk:DescribeApplications,
                         elasticbeanstalk:DescribeEvents, ec2:DescribeImages]
                Resource: '*'
              - Sid: CreateOnlyWebsiteVersion
                Effect: Allow
                Action: elasticbeanstalk:CreateApplicationVersion
                Resource:
                  - !Sub arn:aws:elasticbeanstalk:${AWS::Region}:${AWS::AccountId}:application/retro-coop
                  - !Sub arn:aws:elasticbeanstalk:${AWS::Region}:${AWS::AccountId}:applicationversion/retro-coop/main-*
              - Sid: UpdateOnlyWebsiteEnvironment
                Effect: Allow
                Action: elasticbeanstalk:UpdateEnvironment
                Resource: !Sub arn:aws:elasticbeanstalk:${AWS::Region}:${AWS::AccountId}:environment/retro-coop/retro-coop-web
              - Sid: InspectExistingEbStack
                Effect: Allow
                Action: [cloudformation:GetTemplate, cloudformation:DescribeStackResource]
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/awseb-*-stack/*
Outputs:
  RoleArn:
    Value: !GetAtt MainCdRole.Arn
