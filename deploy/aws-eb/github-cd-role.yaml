AWSTemplateFormatVersion: '2010-09-09'
Description: Main-branch OIDC access for the existing Retro Coop Elastic Beanstalk release.
Parameters:
  GitHubMainSubject:
    Type: String
    NoEcho: true
    Description: Exact GitHub OIDC subject for this repository's main branch.
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  MainCdRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: retro-coop-main-cd
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-AWSElasticBeanstalk
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubMainSubject
      Policies:
        - PolicyName: ExistingWebsiteRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: ExactImageRepository
                Effect: Allow
                Action: [ecr:DescribeRepositories, ecr:ListImages, ecr:DescribeImages,
                         ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
                         ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                         ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/retro-coop
              - Sid: ReadExistingFoundation
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/retro-coop-website-foundation/*
              - Sid: PrepareReviewedRelayChange
                Effect: Allow
                Action: [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet,
                         cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet]
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/retro-coop-website-foundation/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: five-slot-relay-*
              - Sid: ReadSecurityGroup
                Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: '*'
              - Sid: UpdateExistingFoundationSecurityGroup
                Effect: Allow
                Action: [ec2:AuthorizeSecurityGroupIngress, ec2:RevokeSecurityGroupIngress]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/aws:cloudformation:stack-name: retro-coop-website-foundation
                    aws:ResourceTag/aws:cloudformation:logical-id: AppSecurityGroup
Outputs:
  RoleArn:
    Value: !GetAtt MainCdRole.Arn
