AWSTemplateFormatVersion: '2010-09-09'
Description: Retro Coop single-instance website support in us-east-1; EB creates the sole EC2 instance and Elastic IP separately.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  HostedZoneId:
    Type: String
  BootstrapBucket:
    Type: String
  GuardCodeKey:
    Type: String
  AlertEmail:
    Type: String
Resources:
  Images:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: retro-coop
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
  TurnSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared short-lived TURN credential signing key
      GenerateSecretString:
        PasswordLength: 64
        ExcludeUppercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Retro Coop single public web and TURN instance; no SSH or coordinator ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: udp, FromPort: 3478, ToPort: 3478, CidrIp: 0.0.0.0/0}
        - {IpProtocol: udp, FromPort: 49160, ToPort: 49175, CidrIp: 0.0.0.0/0}
  EbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadTurnSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TurnSecret
  EbProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EbRole]
  ExpectedWebsiteIp:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /retro-coop/website/expected-ip
      Type: String
      Value: UNCONFIGURED
  GuardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/retro-coop-cost-guard
      RetentionInDays: 7
  GuardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScopedWebsiteShutdown
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: budgets:ViewBudget
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/retro-coop-website-monthly
              - Effect: Allow
                Action: billing:GetBillingViewData
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/retro-coop/website/expected-ip
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsActions: [DELETE]
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [retro-coop.1001.page]
                    route53:ChangeResourceRecordSetsRecordTypes: [A]
              - Effect: Allow
                Action: elasticbeanstalk:DescribeEnvironments
                Resource: '*'
              - Effect: Allow
                Action: elasticbeanstalk:TerminateEnvironment
                Resource: !Sub arn:aws:elasticbeanstalk:${AWS::Region}:${AWS::AccountId}:environment/retro-coop/retro-coop-web
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/retro-coop-cost-guard:*
  GuardFunction:
    Type: AWS::Lambda::Function
    DependsOn: GuardLogGroup
    Properties:
      FunctionName: retro-coop-cost-guard
      Runtime: python3.12
      Handler: cost_guard.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt GuardRole.Arn
      Code:
        S3Bucket: !Ref BootstrapBucket
        S3Key: !Ref GuardCodeKey
      Environment:
        Variables:
          ACCOUNT_ID: !Ref AWS::AccountId
          HOSTNAME: retro-coop.1001.page
          HOSTED_ZONE_ID: !Ref HostedZoneId
          EXPECTED_IP_PARAMETER: !Ref ExpectedWebsiteIp
  GuardScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: retro-coop-cost-guard
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeOnlyCostGuard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GuardFunction.Arn
  GuardSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: retro-coop-cost-guard-6h
      GroupName: !Ref GuardScheduleGroup
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt GuardFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"dryRun":false}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
  GuardAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: retro-coop-cost-guard-failures
  GuardAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref GuardAlerts
  GuardErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: retro-coop-cost-guard-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref GuardFunction}
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref GuardAlerts]
  GuardDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: retro-coop-cost-guard-delivery-errors
      Namespace: AWS/Scheduler
      MetricName: TargetErrorCount
      Dimensions:
        - {Name: ScheduleGroup, Value: !Ref GuardScheduleGroup}
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref GuardAlerts]
  GuardDroppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: retro-coop-cost-guard-dropped-invocations
      Namespace: AWS/Scheduler
      MetricName: InvocationDroppedCount
      Dimensions:
        - {Name: ScheduleGroup, Value: !Ref GuardScheduleGroup}
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref GuardAlerts]
  GuardTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref GuardAlerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sns:Publish
            Resource: !Ref GuardAlerts
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref GuardAlerts
            Condition:
              StringLike:
                aws:SourceArn: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:retro-coop-cost-guard-*
Outputs:
  EcrRepository:
    Value: !GetAtt Images.RepositoryUri
  TurnSecretArn:
    Value: !Ref TurnSecret
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  EbProfileName:
    Value: !Ref EbProfile
  GuardFunctionArn:
    Value: !GetAtt GuardFunction.Arn
  GuardScheduleName:
    Value: !Ref GuardSchedule
  GuardScheduleGroupName:
    Value: !Ref GuardScheduleGroup
  GuardAlertTopicArn:
    Value: !Ref GuardAlerts
  ExpectedIpParameterName:
    Value: !Ref ExpectedWebsiteIp
