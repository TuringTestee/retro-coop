AWSTemplateFormatVersion: '2010-09-09'
Description: Retro Coop website support resources in us-east-1. The EB environment is created from a reviewed immutable release separately.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  RelaySubnetId:
    Type: AWS::EC2::Subnet::Id
  RelayAmiId:
    Type: AWS::EC2::Image::Id
  HostedZoneId:
    Type: String
  BootstrapBucket:
    Type: String
  BootstrapPrefix:
    Type: String
  GuardCodeKey:
    Type: String
  AlertEmail:
    Type: String
Resources:
  Images:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: retro-coop
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: retro-coop.1001.page
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: retro-coop.1001.page
          HostedZoneId: !Ref HostedZoneId
  TurnSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared short-lived TURN credential signing key
      GenerateSecretString:
        PasswordLength: 64
        ExcludeUppercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Retro Coop public HTTPS load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Retro Coop edge only from its ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  RelaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Retro Coop bounded public UDP TURN allocations, no SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 3478
          ToPort: 3478
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 49160
          ToPort: 49175
          CidrIp: 0.0.0.0/0
  EbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadTurnSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TurnSecret
  EbProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EbRole]
  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadRelayBootMaterial
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TurnSecret
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${BootstrapBucket}/${BootstrapPrefix}/*
  RelayProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RelayRole]
  RelayAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  RelayInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref RelayAmiId
      SubnetId: !Ref RelaySubnetId
      IamInstanceProfile: !Ref RelayProfile
      SecurityGroupIds: [!Ref RelaySecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends awscli coturn iproute2 python3
          install -d -m 0700 /opt/retro-coop /run/retro-coop
          aws s3 cp s3://${BootstrapBucket}/${BootstrapPrefix}/render_turn.py /opt/retro-coop/render_turn.py --region ${AWS::Region} --quiet
          aws s3 cp s3://${BootstrapBucket}/${BootstrapPrefix}/configure_turn.sh /opt/retro-coop/configure_turn.sh --region ${AWS::Region} --quiet
          aws secretsmanager get-secret-value --secret-id ${TurnSecret} --region ${AWS::Region} --query SecretString --output json | python3 -c 'import json,sys;sys.stdout.write(json.load(sys.stdin))' > /run/retro-coop/secret
          chmod 0600 /run/retro-coop/secret
          token=$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
          private_ip=$(curl -fsS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/local-ipv4)
          sh /opt/retro-coop/configure_turn.sh ${RelayAddress} "$private_ip" /run/retro-coop/secret
      Tags:
        - Key: Name
          Value: retro-coop-turn
        - Key: Project
          Value: retro-coop
  RelayAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt RelayAddress.AllocationId
      InstanceId: !Ref RelayInstance
  ExpectedAlbDns:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /retro-coop/website/expected-alb-dns
      Type: String
      Value: UNCONFIGURED
  GuardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/retro-coop-cost-guard
      RetentionInDays: 7
  GuardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScopedWebsiteShutdown
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: budgets:ViewBudget
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/retro-coop-website-monthly
              - Effect: Allow
                Action: billing:GetBillingViewData
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/retro-coop/website/expected-alb-dns
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsActions: [DELETE]
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [retro-coop.1001.page]
                    route53:ChangeResourceRecordSetsRecordTypes: [A]
              - Effect: Allow
                Action: elasticbeanstalk:DescribeEnvironments
                Resource: '*'
              - Effect: Allow
                Action: elasticbeanstalk:TerminateEnvironment
                Resource: !Sub arn:aws:elasticbeanstalk:${AWS::Region}:${AWS::AccountId}:environment/retro-coop/retro-coop-web
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${RelayInstance}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/retro-coop-cost-guard:*
  GuardFunction:
    Type: AWS::Lambda::Function
    DependsOn: GuardLogGroup
    Properties:
      FunctionName: retro-coop-cost-guard
      Runtime: python3.12
      Handler: cost_guard.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt GuardRole.Arn
      Code:
        S3Bucket: !Ref BootstrapBucket
        S3Key: !Ref GuardCodeKey
      Environment:
        Variables:
          ACCOUNT_ID: !Ref AWS::AccountId
          HOSTNAME: retro-coop.1001.page
          HOSTED_ZONE_ID: !Ref HostedZoneId
          RELAY_INSTANCE_ID: !Ref RelayInstance
          EXPECTED_ALB_PARAMETER: !Ref ExpectedAlbDns
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeOnlyCostGuard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GuardFunction.Arn
  GuardSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: retro-coop-cost-guard-6h
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt GuardFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"dryRun":false}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
  GuardAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: retro-coop-cost-guard-failures
  GuardAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref GuardAlerts
  GuardErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: retro-coop-cost-guard-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GuardFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref GuardAlerts]
  GuardTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref GuardAlerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sns:Publish
            Resource: !Ref GuardAlerts
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref GuardAlerts
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:retro-coop-cost-guard-errors
Outputs:
  EcrRepository:
    Value: !GetAtt Images.RepositoryUri
  CertificateArn:
    Value: !Ref Certificate
  TurnSecretArn:
    Value: !Ref TurnSecret
  RelayPublicIp:
    Value: !Ref RelayAddress
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  EbProfileName:
    Value: !Ref EbProfile
  RelayInstanceId:
    Value: !Ref RelayInstance
  GuardFunctionArn:
    Value: !GetAtt GuardFunction.Arn
  GuardScheduleName:
    Value: !Ref GuardSchedule
  GuardAlertTopicArn:
    Value: !Ref GuardAlerts
  ExpectedAlbParameterName:
    Value: !Ref ExpectedAlbDns
