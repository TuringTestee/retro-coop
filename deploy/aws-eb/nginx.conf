worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Room URLs carry unlisted identifiers. Do not log paths, addresses or ROM content.
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 64m;
    server_tokens off;

    # Only the ALB security group can reach this port. AWS appends its actual
    # transport peer to X-Forwarded-For; discard all earlier, caller-supplied entries.
    # The coordinator validates that the selected value is a literal IPv4/IPv6 address.
    map $http_x_forwarded_for $admission_ip {
        ~(?:^|,)\s*(?<last_alb_address>[^,\s]+)\s*$ $last_alb_address;
        default "";
    }
    map $admission_ip $admission_key {
        "" invalid-forwarded-address;
        default $admission_ip;
    }
    limit_conn_zone $admission_key zone=client_connections:1m;
    limit_conn_zone $server_name zone=global_connections:1m;
    limit_req_zone $admission_key zone=client_requests:1m rate=20r/s;

    server {
        listen 8080;
        server_name retro-coop.1001.page;
        root /usr/share/nginx/html;
        index index.html;
        limit_conn client_connections 6;
        limit_conn global_connections 200;
        limit_conn_status 429;
        limit_req zone=client_requests burst=40 nodelay;
        limit_req_status 429;

        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:8787/health;
        }
        location = /coordinator/ws {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header X-Forwarded-For $admission_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1d;
        }
        location ^~ /coordinator/rooms/ {
            proxy_pass http://127.0.0.1:8787/rooms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $admission_ip;
            proxy_set_header X-Forwarded-Proto https;
            # The coordinator starts the upload lease when headers arrive.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 75s;
            limit_rate 2m;
        }
        location ^~ /coordinator/ { return 404; }
        location /assets/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            try_files $uri =404;
        }
        location /catalog/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            try_files $uri =404;
        }
        location /generated/ {
            add_header Cache-Control 'no-store';
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control 'no-store';
            try_files $uri $uri/ /index.html;
        }
    }
}
